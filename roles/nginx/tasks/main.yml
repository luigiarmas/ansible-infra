---
# tasks file for nginx
- name: Instalar nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Página del laboratorio generada por la plantilla
  ansible.builtin.template:
    src: lab.html.j2
    dest: /usr/share/nginx/html/lab.html
    owner: root
    group: root
    mode: "0644"

- name: Configuración de seguridad de nginx
  ansible.builtin.template:
    src: seguridad.conf.j2
    dest: /etc/nginx/conf.d/seguridad.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recargar nginx

- name: Arrancar nginx y habilitarlo al inicio
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Asegurar que firewalld esté instalado
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Asegurar que firewalld esté activo y habilitado
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Permitir HTTP en el firewall
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled

- name: Verificar que la página responde
  ansible.builtin.uri:
    url: http://localhost/lab.html
    return_content: true
  register: nginx_respuesta
  failed_when: inventory_hostname not in nginx_respuesta.content
