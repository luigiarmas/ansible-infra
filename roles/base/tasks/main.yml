---
# tasks file for base
- name: Paquetes base en la familia RedHat
  ansible.builtin.dnf:
    name: "{{ paquetes_base }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Paquetes base en la familia Debian
  ansible.builtin.apt:
    name: "{{ paquetes_base }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Directorios de trabajo del laboratorio
  ansible.builtin.file:
    path: "/opt/lab/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop: "{{ base_directorios_lab }}"
